<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АвтоКит — Магазин автозапчастей в Костанае</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090e17;
      --card-bg: rgba(22, 30, 46, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --accent-glow: rgba(37, 99, 235, 0.4);
      --wa: #25d366;
      --wa-gradient: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(13, 19, 33, 0.95);
      --input-border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.2) 0px, transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(37, 211, 102, 0.12) 0px, transparent 40%);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 110px;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      background: rgba(37, 211, 102, 0.12);
      border: 1px solid rgba(37, 211, 102, 0.25);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #4ade80;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 10px #4ade80;
    }

    .lang-switcher {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      padding: 3px;
      border-radius: 12px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: #2563eb;
      color: #fff;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 16px 36px -12px rgba(0, 0, 0, 0.6);
    }

    .contacts-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 0.95rem;
    }

    .contacts-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--text-muted);
    }

    .contacts-list strong {
      color: var(--text);
    }

    .contacts-list a {
      color: #60a5fa;
      text-decoration: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-wa-hero {
      background: var(--wa-gradient);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.35);
    }

    .btn-wa-hero:hover {
      box-shadow: 0 6px 24px rgba(37, 211, 102, 0.55);
      transform: translateY(-1px);
    }

    .btn-submit {
      background: var(--accent-gradient);
      color: #ffffff;
      margin-top: 10px;
      box-shadow: 0 4px 18px var(--accent-glow);
    }

    .btn-submit:hover {
      box-shadow: 0 6px 24px rgba(37, 99, 235, 0.5);
      transform: translateY(-1px);
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      margin-bottom: 14px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .chip:hover {
      background: rgba(37, 99, 235, 0.25);
      color: #bfdbfe;
      border-color: rgba(96, 165, 250, 0.4);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .vin-input {
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .map-box {
      width: 100%;
      height: 240px;
      border-radius: 14px;
      overflow: hidden;
      margin-top: 16px;
      border: 1px solid var(--card-border);
    }

    .map-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .wa-float {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--wa-gradient);
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.45);
      z-index: 999;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
    }

    .wa-float:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 30px rgba(37, 211, 102, 0.6);
    }

    .wa-float svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="badgeText">Прием заявок онлайн</span>
      </div>

      <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('ru')">РУС</button>
        <button class="lang-btn" onclick="setLanguage('kz')">ҚАЗ</button>
      </div>
    </div>

    <header>
      <h1>АвтоКит</h1>
      <p class="subtitle" id="subtitleText">Быстрый подбор запчастей по VIN-коду в Костанае</p>
    </header>

    <!-- Контакты и карта -->
    <div class="card">
      <ul class="contacts-list">
        <li>
          <span>📍</span>
          <span><strong id="addrLabel">Адрес:</strong> <span id="addrVal">г. Костанай, ул. Ворошилова 11А</span></span>
        </li>
        <li>
          <span>📞</span>
          <span><strong id="phoneMainLabel">Телефон:</strong> <a href="tel:+77054529356">+7 (705) 452-93-56</a></span>
        </li>
        <li>
          <span>🌐</span>
          <span><strong>Сайт:</strong> <a href="https://akit.kz" target="_blank">akit.kz</a></span>
        </li>
      </ul>

      <a href="#" id="directWaBtn" class="btn btn-wa-hero" target="_blank" rel="noopener noreferrer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm.01 18.06c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.13 8.13 0 0 1-1.25-4.29c0-4.51 3.67-8.18 8.18-8.18 2.19 0 4.24.85 5.79 2.4 1.55 1.55 2.4 3.6 2.4 5.78 0 4.52-3.67 8.19-8.17 8.19zm4.49-6.13c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.12.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.61.19 1.16.17 1.6.1.49-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.29z"/>
        </svg>
        <span id="directWaText">Написать в WhatsApp</span>
      </a>

      <!-- Google Карта -->
      <div class="map-box">
        <iframe 
          loading="lazy" 
          allowfullscreen 
          referrerpolicy="no-referrer-when-downgrade"
          src="https://maps.google.com/maps?q=%D0%9A%D0%BE%D1%81%D1%82%D0%B0%D0%BD%D0%B0%D0%B9,+%D1%83%D0%BB.+%D0%92%D0%BE%D1%80%D0%BE%D1%88%D0%B8%D0%BB%D0%BE%D0%B2%D0%B0+11%D0%90&t=&z=16&ie=UTF8&iwloc=&output=embed">
        </iframe>
      </div>
    </div>

    <!-- Форма подбора запчастей -->
    <div class="card">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 16px;" id="formTitle">Заявка на подбор запчастей</h2>

      <form id="partRequestForm">
        <div class="form-group">
          <label for="carModelInput" id="carLabel">Марка и модель авто</label>
          <input 
            type="text" 
            id="carModelInput" 
            placeholder="Например: Toyota Camry 55, 2.5"
          >
        </div>

        <div class="form-group">
          <label for="vinInput" id="vinLabel">VIN-код кузова *</label>
          <input 
            type="text" 
            id="vinInput" 
            class="vin-input" 
            maxlength="17" 
            placeholder="17 знаков кузова" 
            required
          >
          <span class="hint" id="vinCounter">Введено: 0 / 17</span>
        </div>

        <div class="form-group">
          <label for="partsInput" id="partsLabel">Какие запчасти нужны? *</label>
          <textarea 
            id="partsInput" 
            rows="3" 
            placeholder="Опишите детали или выберите кнопки ниже..." 
            required
          ></textarea>
          
          <div class="quick-chips">
            <button type="button" class="chip" onclick="addPart('Тормозные колодки')">+ Колодки</button>
            <button type="button" class="chip" onclick="addPart('Фильтры (масло, воздух, салон)')">+ Фильтры</button>
            <button type="button" class="chip" onclick="addPart('Моторное масло')">+ Масло</button>
            <button type="button" class="chip" onclick="addPart('Свечи зажигания')">+ Свечи</button>
            <button type="button" class="chip" onclick="addPart('Амортизаторы / ходовая')">+ Подвеска</button>
          </div>
        </div>

        <div class="form-group">
          <label for="phoneInput" id="phoneLabel">Ваш номер телефона *</label>
          <input 
            type="tel" 
            id="phoneInput" 
            placeholder="+7 (___) ___-__-__" 
            required
          >
        </div>

        <button type="submit" class="btn btn-submit" id="submitBtnText">
          Отправить заявку в WhatsApp
        </button>
      </form>
    </div>
  </div>

  <!-- Плавающая иконка WhatsApp -->
  <a href="#" id="floatWaBtn" class="wa-float" target="_blank" rel="noopener noreferrer" title="WhatsApp">
    <svg viewBox="0 0 24 24">
      <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm.01 18.06c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.13 8.13 0 0 1-1.25-4.29c0-4.51 3.67-8.18 8.18-8.18 2.19 0 4.24.85 5.79 2.4 1.55 1.55 2.4 3.6 2.4 5.78 0 4.52-3.67 8.19-8.17 8.19zm4.49-6.13c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.12.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.61.19 1.16.17 1.6.1.49-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.29z"/>
    </svg>
  </a>

  <script>
    // Ваш рабочий номер
    const STORE_PHONE = "77054529356";

    // Ссылки на WhatsApp
    document.getElementById('directWaBtn').href = `https://wa.me/${STORE_PHONE}?text=${encodeURIComponent('Здравствуйте! Хочу уточнить наличие автозапчастей.')}`;
    document.getElementById('floatWaBtn').href = `https://wa.me/${STORE_PHONE}`;

    let currentLang = 'ru';

    const translations = {
      ru: {
        badge: "Прием заявок онлайн",
        subtitle: "Быстрый подбор запчастей по VIN-коду в Костанае",
        addrLabel: "Адрес:",
        addrVal: "г. Костанай, ул. Ворошилова 11А",
        phoneMainLabel: "Телефон:",
        directWa: "Написать в WhatsApp",
        formTitle: "Заявка на подбор запчастей",
        carLabel: "Марка и модель авто",
        carPlaceholder: "Например: Toyota Camry 55, 2.5",
        vinLabel: "VIN-код кузова *",
        vinPlaceholder: "17 знаков кузова",
        vinCounter: "Введено: ",
        partsLabel: "Какие запчасти нужны? *",
        partsPlaceholder: "Опишите детали или выберите кнопки ниже...",
        phoneLabel: "Ваш номер телефона *",
        submitBtn: "Отправить заявку в WhatsApp",
        vinAlert: "Пожалуйста, введите корректный VIN-код из 17 символов.",
        waMsgGreeting: "Здравствуйте! Заявка на подбор запчастей (АвтоКит):",
        waMsgCar: "🚘 Авто:",
        waMsgVin: "🔢 VIN:",
        waMsgParts: "🔧 Детали:",
        waMsgPhone: "📞 Телефон клиента:"
      },
      kz: {
        badge: "Онлайн тапсырыс қабылдау",
        subtitle: "Қостанайда VIN-код бойынша автобөлшектерді жылдам таңдау",
        addrLabel: "Мекенжай:",
        addrVal: "Қостанай қ., Ворошилов к-сі 11А",
        phoneMainLabel: "Телефон:",
        directWa: "WhatsApp-пен байланысу",
        formTitle: "Автобөлшектерге тапсырыс беру",
        carLabel: "Автокөліктің маркасы мен моделі",
        carPlaceholder: "Мысалы: Toyota Camry 55, 2.5",
        vinLabel: "Көліктің VIN-коды *",
        vinPlaceholder: "17 таңбалы шанақ нөмірі",
        vinCounter: "Енгізілді: ",
        partsLabel: "Қандай бөлшектер қажет? *",
        partsPlaceholder: "Бөлшектерді жазыңыз немесе төмендегі батырмаларды басыңыз...",
        phoneLabel: "Байланыс телефоныңыз *",
        submitBtn: "Өтінімді WhatsApp-қа жіберу",
        vinAlert: "VIN-код толық 17 таңбадан тұруы тиіс.",
        waMsgGreeting: "Сәлеметсіз бе! Автобөлшектерге сұраныс (АвтоКит):",
        waMsgCar: "🚘 Көлік:",
        waMsgVin: "🔢 VIN:",
        waMsgParts: "🔧 Бөлшектер:",
        waMsgPhone: "📞 Клиент телефоны:"
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('badgeText').textContent = t.badge;
      document.getElementById('subtitleText').textContent = t.subtitle;
      document.getElementById('addrLabel').textContent = t.addrLabel;
      document.getElementById('addrVal').textContent = t.addrVal;
      document.getElementById('phoneMainLabel').textContent = t.phoneMainLabel;
      document.getElementById('directWaText').textContent = t.directWa;
      document.getElementById('formTitle').textContent = t.formTitle;
      document.getElementById('carLabel').textContent = t.carLabel;
      document.getElementById('carModelInput').placeholder = t.carPlaceholder;
      document.getElementById('vinLabel').textContent = t.vinLabel;
      document.getElementById('vinInput').placeholder = t.vinPlaceholder;
      document.getElementById('partsLabel').textContent = t.partsLabel;
      document.getElementById('partsInput').placeholder = t.partsPlaceholder;
      document.getElementById('phoneLabel').textContent = t.phoneLabel;
      document.getElementById('submitBtnText').textContent = t.submitBtn;

      updateCounter();
    }

    function addPart(text) {
      const partsInput = document.getElementById('partsInput');
      if (partsInput.value.trim().length > 0) {
        partsInput.value += ', ' + text;
      } else {
        partsInput.value = text;
      }
      partsInput.focus();
    }

    const vinInput = document.getElementById('vinInput');
    const vinCounter = document.getElementById('vinCounter');

    function updateCounter() {
      const len = vinInput.value.length;
      vinCounter.textContent = `${translations[currentLang].vinCounter}${len} / 17`;
      vinCounter.style.color = (len === 17) ? '#4ade80' : 'var(--text-muted)';
    }

    vinInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      updateCounter();
    });

    const phoneInput = document.getElementById('phoneInput');
    phoneInput.addEventListener('input', (e) => {
      let x = e.target.value.replace(/\D/g, '').match(/(\d{0,1})(\d{0,3})(\d{0,3})(\d{0,2})(\d{0,2})/);
      if (!x[2]) {
        e.target.value = x[1] ? `+${x[1]}` : '';
      } else {
        e.target.value = `+${x[1]} (${x[2]}` + (x[3] ? `) ${x[3]}` : '') + (x[4] ? `-${x[4]}` : '') + (x[5] ? `-${x[5]}` : '');
      }
    });

    document.getElementById('partRequestForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const t = translations[currentLang];
      const car = document.getElementById('carModelInput').value.trim();
      const vin = vinInput.value.trim();
      const parts = document.getElementById('partsInput').value.trim();
      const phone = phoneInput.value.trim();

      if (vin.length < 17) {
        alert(t.vinAlert);
        return;
      }

      const msg = `${t.waMsgGreeting}\n\n` +
                  (car ? `${t.waMsgCar} ${car}\n` : '') +
                  `${t.waMsgVin} ${vin}\n` +
                  `${t.waMsgParts} ${parts}\n` +
                  `${t.waMsgPhone} ${phone}`;

      window.open(`https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
    });
  </script>
</body>
</html>
